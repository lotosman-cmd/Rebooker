<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173b5e"><title>Rebooker</title><style>
:root{--navy:#173b5e;--blue:#246a9b;--bg:#f3f6f9;--line:#dce4eb;--muted:#667788}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#182532}header{background:var(--navy);color:white;padding:18px 16px}header h1{font-size:22px;margin:0 0 5px}header p{font-size:12px;margin:0;color:#d8e7f3}.wrap{padding:14px;max-width:760px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #132c4410}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd6df;border-radius:9px;font:14px Tahoma;margin:6px 0;background:white}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:9px;padding:11px 14px;background:var(--blue);color:white;font:13px Tahoma;cursor:pointer}button.secondary{background:#e9eff4;color:#20394e}button.danger{background:#a63d3d}button:disabled{opacity:.45}.full{width:100%;margin-top:8px}.muted{color:var(--muted);font-size:12px}.item{border:1px solid var(--line);padding:12px;border-radius:10px;margin:8px 0}.hidden{display:none}.progress{height:6px;background:#e4ebf1;border-radius:8px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#31916f}.answer{background:#f6f8fa;border-radius:8px;padding:9px;margin:7px 0;font-size:13px}.tag{font-size:11px;color:#27634c;background:#e7f5ee;padding:4px 8px;border-radius:20px}
</style></head><body><header><h1>Rebooker</h1><p>دفتر هوشمند پاسخ‌های تکراری · اطلاعات فقط روی همین دستگاه ذخیره می‌شود</p></header><main class="wrap" id="app"></main><script>
const $=s=>document.querySelector(s);let db=JSON.parse(localStorage.getItem('rebooker_db')||'{"projects":[],"bank":[]}');let current=null,pageIndex=0;
function save(){localStorage.setItem('rebooker_db',JSON.stringify(db))}function touch(){current.updated=Date.now();current.finalized=false}function putBank(q,a){let k=q.trim().toLocaleLowerCase('fa');let old=db.bank.find(x=>x.q.trim().toLocaleLowerCase('fa')===k);if(old)old.a=a;else db.bank.unshift({q,a})}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){current=null;$('#app').innerHTML=`<section class="card"><h2>ایجاد پروژه جدید</h2><input id="pname" placeholder="عنوان پروژه، مثلاً ثبت‌نام سامانه"><button class="full" onclick="addProject()">ایجاد پروژه</button></section><section class="card"><div class="row between"><h2>پروژه‌های من</h2><span class="tag">${db.projects.length} پروژه</span></div>${db.projects.length?db.projects.map(p=>`<div class="item"><div class="row between"><b>${esc(p.name)}</b><button onclick="openProject('${p.id}')">ورود</button></div><p class="muted">${p.pages.length} صفحه · آخرین تغییر ${new Date(p.updated).toLocaleDateString('fa-IR')}</p></div>`).join(''):'<p class="muted">هنوز پروژه‌ای ثبت نشده است.</p>'}</section><section class="card"><h2>بانک پاسخ‌ها</h2><input id="search" placeholder="جست‌وجوی سؤال یا پاسخ" oninput="searchBank()"><div id="bankresults"></div><div class="row"><button class="secondary" onclick="backup()">پشتیبان‌گیری</button><button class="secondary" onclick="$('#restore').click()">بازیابی نسخه پشتیبان</button><input id="restore" type="file" accept="application/json" class="hidden" onchange="restore(event)"></div></section>`}
function addProject(){let n=$('#pname').value.trim();if(!n)return alert('عنوان پروژه را وارد کنید.');db.projects.push({id:id(),name:n,pages:[],updated:Date.now()});save();home()}
function openProject(pid){current=db.projects.find(p=>p.id===pid);pageIndex=0;projectView()}
function projectView(){let p=current;$('#app').innerHTML=`<div class="row between"><button class="secondary" onclick="home()">بازگشت</button><span class="muted">${esc(p.name)}</span></div><section class="card"><h2>صفحات پروژه</h2>${p.pages.map((pg,i)=>`<div class="item row between"><div><b>${esc(pg.name)}</b><div class="muted">${pg.questions.length} پرسش · ${pg.confirmed?'تأیید شده':'در انتظار تأیید'}</div></div><button onclick="editPage(${i})">بازبینی</button></div>`).join('')||'<p class="muted">صفحه‌ای ایجاد نشده است.</p>'}<button class="full" onclick="newPage()">افزودن صفحه جدید</button><button class="full" style="background:#26734f" onclick="finalize()">تأیید و ثبت نهایی پروژه</button><button class="full danger" onclick="deleteProject()">حذف پروژه</button></section>`}
function newPage(){if(current.finalized)return alert('این پروژه ثبت نهایی شده است و قابل ویرایش نیست.');let name=prompt('عنوان صفحه را وارد کنید:');if(!name||!name.trim())return;current.pages.push({id:id(),name:name.trim(),questions:[],confirmed:false});pageIndex=current.pages.length-1;editPage(pageIndex)}
function editPage(i){pageIndex=i;let pg=current.pages[i];$('#app').innerHTML=`<div class="row between"><button class="secondary" onclick="projectView()">بازگشت به پروژه</button><span class="muted">صفحه ${i+1} از ${current.pages.length}</span></div><section class="card"><h2>${esc(pg.name)}</h2><div class="progress"><span style="width:${pg.confirmed?100:0}%"></span></div>${pg.questions.map((q,j)=>`<div class="item"><label><b>${esc(q.q)}</b></label><div class="answer">${esc(q.a)}</div><div class="row"><button class="secondary" onclick="editQA(${j})">ویرایش</button><button class="secondary" onclick="removeQA(${j})">حذف</button></div></div>`).join('')}<h3>افزودن پرسش و پاسخ</h3><input id="question" placeholder="متن سؤال"><textarea id="answer" placeholder="پاسخ یا توضیح"></textarea><button class="full" onclick="addQA()">ثبت پرسش و پاسخ</button><button class="full" style="background:#26734f" onclick="confirmPage()">تأیید این صفحه و ادامه</button><p class="muted">تا زمانی که این صفحه تأیید نشود، ثبت نهایی پروژه ممکن نیست.</p></section>`}
function addQA(){if(current.finalized)return alert('پروژه ثبت نهایی شده است.');let q=$('#question').value.trim(),a=$('#answer').value.trim();if(!q||!a)return alert('سؤال و پاسخ هر دو الزامی هستند.');let pg=current.pages[pageIndex];pg.questions.push({q,a});pg.confirmed=false;putBank(q,a);touch();save();editPage(pageIndex)}function editQA(j){if(current.finalized)return alert('پروژه ثبت نهایی شده است.');let q=current.pages[pageIndex].questions[j],nq=prompt('ویرایش سؤال',q.q);if(nq===null)return;let na=prompt('ویرایش پاسخ',q.a);if(na===null)return;q.q=nq.trim();q.a=na.trim();current.pages[pageIndex].confirmed=false;putBank(q.q,q.a);touch();save();editPage(pageIndex)}function removeQA(j){if(current.finalized)return alert('پروژه ثبت نهایی شده است.');if(confirm('این پرسش و پاسخ حذف شود؟')){current.pages[pageIndex].questions.splice(j,1);current.pages[pageIndex].confirmed=false;save();editPage(pageIndex)}}
function confirmPage(){if(current.finalized)return alert('پروژه ثبت نهایی شده است.');let pg=current.pages[pageIndex];if(!pg.questions.length)return alert('برای تأیید صفحه، حداقل یک پرسش و پاسخ ثبت کنید.');if(!confirm('محتوای این صفحه را تأیید می‌کنید؟'))return;pg.confirmed=true;current.updated=Date.now();save();if(pageIndex<current.pages.length-1)editPage(pageIndex+1);else projectView()}
function finalize(){if(current.finalized)return alert('این پروژه قبلاً ثبت نهایی شده است.');if(!current.pages.length)return alert('پروژه هنوز صفحه‌ای ندارد.');let missing=current.pages.findIndex(p=>!p.confirmed);if(missing>=0){alert('صفحه «'+current.pages[missing].name+'» هنوز تأیید نشده است.');editPage(missing);return}if(!confirm('ثبت نهایی پروژه انجام شود؟'))return;current.finalized=true;current.updated=Date.now();save();alert('پروژه با موفقیت ثبت نهایی شد.');projectView()}
function deleteProject(){if(confirm('کل پروژه و پاسخ‌های مربوط به آن حذف شود؟')){db.projects=db.projects.filter(p=>p.id!==current.id);save();home()}}
function searchBank(){let v=$('#search').value.toLowerCase(),a=db.bank.filter(x=>(x.q+' '+x.a).toLowerCase().includes(v)).slice(0,30);$('#bankresults').innerHTML=a.map(x=>`<div class="answer"><b>${esc(x.q)}</b><br>${esc(x.a)}</div>`).join('')||'<p class="muted">موردی پیدا نشد.</p>'}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='rebooker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.projects)||!Array.isArray(d.bank))throw 0;if(confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟')){db=d;save();home()}}catch(_){alert('فایل پشتیبان معتبر نیست.')}};r.readAsText(f)}
home();
</script></main></body></html>
